<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Μαθηματική Αποστολή — Α΄ Γυμνασίου</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#68738a;--accent:#5b5bd6;--accent2:#ececff;--good:#15803d;--goodbg:#eaf8ef;--bad:#b91c1c;--badbg:#fff0f0;--border:#dce1ec}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
main{max-width:780px;margin:auto;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 8px 28px #17203312}
h1{font-size:clamp(24px,5vw,36px);margin:0 0 8px}.sub{color:var(--muted);margin:0 0 20px}
.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.pill{padding:7px 12px;border-radius:999px;background:var(--accent2);font-weight:800;font-size:14px}
.progress{height:10px;background:#e8ebf2;border-radius:99px;overflow:hidden;margin:18px 0}.bar{height:100%;width:0;background:var(--accent);transition:width .25s}
.question{font-size:clamp(21px,4vw,28px);font-weight:850;line-height:1.3;margin:18px 0}
.answers{display:grid;gap:12px}.answer{width:100%;min-height:54px;text-align:left;background:#fff;border:2px solid var(--border);border-radius:15px;padding:13px 15px;font-size:17px;font-weight:700;cursor:pointer}
.answer:hover,.answer:focus{border-color:var(--accent);outline:none}.answer:disabled{cursor:default}.correct{border-color:var(--good)!important;background:var(--goodbg)!important}.wrong{border-color:var(--bad)!important;background:var(--badbg)!important}
.feedback{margin-top:15px;padding:14px;border-radius:15px;font-weight:700}.good{background:var(--goodbg);color:var(--good)}.bad{background:var(--badbg);color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.btn{min-height:48px;border:0;border-radius:14px;padding:11px 18px;font-weight:850;font-size:15px;cursor:pointer;background:var(--accent);color:white}.btn.secondary{background:#eef0f6;color:var(--text)}.btn:focus{outline:3px solid #a9a9ff;outline-offset:2px}
.settings{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0 0}.settings label{font-weight:700}.settings select{padding:9px;border:1px solid var(--border);border-radius:10px;font-size:15px}
.hidden{display:none!important}.result{text-align:center}.stars{font-size:34px;margin:10px}.review{margin-top:18px;text-align:left}.review-item{padding:12px;border-top:1px solid var(--border)}small{color:var(--muted)}
@media(max-width:520px){main{padding:12px}.card{padding:17px}.answer{font-size:16px}}
@media(prefers-reduced-motion:reduce){.bar{transition:none}}
</style>
</head>
<body>
<main>
<section id="start" class="card">
<div class="top"><span class="pill">📚 Α΄ Γυμνασίου</span><span class="pill">🎯 30 ερωτήσεις</span></div>
<h1>Μαθηματική Αποστολή 🚀</h1>
<p class="sub">Μικρά βήματα, μία ερώτηση τη φορά. Κάνε το quiz με τον δικό σου ρυθμό.</p>
<div class="settings">
<label>Επίπεδο:
<select id="level"><option value="all">Όλα τα επίπεδα</option><option value="easy">🟢 Ήπιο</option><option value="medium">🟡 Κανονικό</option><option value="hard">🔴 Πρόκληση</option></select></label>
<label><input type="checkbox" id="timer"> Χρονόμετρο 20″ ανά ερώτηση</label>
</div>
<div class="actions"><button class="btn" id="startBtn">Ξεκινάμε! ▶</button></div>
<p><small>💡 Το χρονόμετρο είναι προαιρετικό. Για μαθητή με ΔΕΠΥ προτείνεται αρχικά χωρίς χρονόμετρο.</small></p>
</section>

<section id="quiz" class="card hidden" aria-live="polite">
<div class="top"><span class="pill" id="topic"></span><span class="pill" id="score">⭐ 0</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="top"><small id="counter"></small><strong id="time"></strong></div>
<div class="question" id="question"></div>
<div class="answers" id="answers"></div>
<div id="feedback" class="feedback hidden"></div>
<div class="actions"><button class="btn hidden" id="next">Επόμενη ➜</button><button class="btn secondary hidden" id="skip">Παράλειψη</button></div>
</section>

<section id="result" class="card result hidden">
<div class="stars" id="stars"></div><h1 id="resultTitle"></h1>
<p id="resultText"></p>
<div class="actions" style="justify-content:center"><button class="btn" id="again">🔄 Ξανά</button><button class="btn secondary" id="reviewBtn">📋 Δες τα λάθη</button></div>
<div id="review" class="review hidden"></div>
</section>
</main>

<script>
const BANK=[
{t:"1.1 Φυσικοί αριθμοί",l:"easy",q:"Ποιος είναι ο μεγαλύτερος αριθμός;",a:["4.205","4.250","4.052","4.025"],c:1,e:"Συγκρίνουμε πρώτα τις χιλιάδες, μετά τις εκατοντάδες και ούτω καθεξής."},
{t:"1.1 Διάταξη",l:"easy",q:"Ποιος είναι ο μικρότερος;",a:["1.099","1.909","1.190","1.019"],c:3,e:"Το 1.019 είναι μικρότερο από τους άλλους αριθμούς."},
{t:"1.1 Στρογγυλοποίηση",l:"easy",q:"Στρογγύλεψε το 3.648 στην πλησιέστερη εκατοντάδα.",a:["3.600","3.700","3.650","4.000"],c:1,e:"Το ψηφίο των δεκάδων είναι 4; Πρόσεξε: για εκατοντάδες κοιτάμε τις δεκάδες. Εδώ 48 ≥ 50; Όχι — άρα 3.600."},
{t:"1.1 Στρογγυλοποίηση",l:"medium",q:"Στρογγύλεψε το 7.650 στην πλησιέστερη εκατοντάδα.",a:["7.600","7.650","7.700","8.000"],c:2,e:"Οι δεκάδες είναι 5, άρα ανεβαίνουμε στην επόμενη εκατοντάδα: 7.700."},
{t:"1.2 Πρόσθεση",l:"easy",q:"348 + 127 = ?",a:["465","475","485","495"],c:1,e:"348 + 127 = 475."},
{t:"1.2 Αφαίρεση",l:"easy",q:"800 − 356 = ?",a:["444","454","464","544"],c:0,e:"800 − 356 = 444."},
{t:"1.2 Πολλαπλασιασμός",l:"easy",q:"24 × 5 = ?",a:["100","110","120","125"],c:2,e:"24 × 5 = 120."},
{t:"1.2 Πράξεις",l:"medium",q:"125 × 8 = ?",a:["900","1.000","1.025","1.250"],c:1,e:"125 × 8 = 1.000."},
{t:"1.2 Πράξεις",l:"hard",q:"250 − 3 × 40 = ?",a:["100","130","238","10"],c:1,e:"Πρώτα ο πολλαπλασιασμός: 3×40=120. Μετά 250−120=130."},
{t:"1.3 Δυνάμεις",l:"easy",q:"2³ = ?",a:["5","6","8","9"],c:2,e:"2³ = 2×2×2 = 8."},
{t:"1.3 Δυνάμεις",l:"easy",q:"Ποια είναι η βάση στη δύναμη 7²;",a:["2","7","9","14"],c:1,e:"Η βάση είναι ο αριθμός που επαναλαμβάνεται: 7."},
{t:"1.3 Δυνάμεις",l:"easy",q:"Ποια παράσταση ισούται με 3⁴;",a:["3+3+3+3","3×4","3×3×3×3","4×4×4"],c:2,e:"Ο εκθέτης 4 σημαίνει τέσσερις παράγοντες 3."},
{t:"1.3 Δυνάμεις",l:"medium",q:"5² = ?",a:["10","15","20","25"],c:3,e:"5² = 5×5 = 25."},
{t:"1.3 Δυνάμεις",l:"hard",q:"2⁴ + 3² = ?",a:["17","18","25","36"],c:0,e:"2⁴=16 και 3²=9, άρα 16+9=25. Ξανακοίτα την επιλογή 25."},
{t:"1.4 Ευκλείδεια διαίρεση",l:"easy",q:"Στη διαίρεση 17 = 5×3 + 2, ποιο είναι το υπόλοιπο;",a:["2","3","5","17"],c:0,e:"Το υπόλοιπο είναι ο αριθμός που μένει: 2."},
{t:"1.4 Ευκλείδεια διαίρεση",l:"easy",q:"29 = 4×7 + ?",a:["0","1","3","4"],c:1,e:"4×7=28, άρα μένει 1."},
{t:"1.4 Διαιρετότητα",l:"easy",q:"Ποιος αριθμός διαιρείται ακριβώς με το 5;",a:["42","63","75","88"],c:2,e:"Οι αριθμοί που διαιρούνται με το 5 τελειώνουν σε 0 ή 5."},
{t:"1.4 Διαιρετότητα",l:"medium",q:"Ποιος είναι διαιρέτης του 24;",a:["5","7","8","10"],c:2,e:"24 ÷ 8 = 3, χωρίς υπόλοιπο."},
{t:"1.5 Χαρακτήρες διαιρετότητας",l:"easy",q:"Ποιος αριθμός διαιρείται με το 3;",a:["124","125","126","128"],c:2,e:"1+2+6=9 και το 9 διαιρείται με το 3."},
{t:"1.5 Χαρακτήρες διαιρετότητας",l:"medium",q:"Ποιος αριθμός διαιρείται με το 2 και με το 5;",a:["24","35","40","63"],c:2,e:"Για να διαιρείται και με 2 και με 5, πρέπει να είναι πολλαπλάσιο του 10. Το 40 είναι."},
{t:"1.5 ΜΚΔ",l:"easy",q:"ΜΚΔ(12, 18) = ?",a:["2","3","6","9"],c:2,e:"Οι κοινοί διαιρέτες είναι 1,2,3,6. Ο μεγαλύτερος είναι 6."},
{t:"1.5 ΜΚΔ",l:"medium",q:"ΜΚΔ(20, 30) = ?",a:["5","10","15","20"],c:1,e:"Ο μεγαλύτερος κοινός διαιρέτης των 20 και 30 είναι το 10."},
{t:"1.5 ΕΚΠ",l:"easy",q:"ΕΚΠ(4, 6) = ?",a:["8","10","12","24"],c:2,e:"Τα πολλαπλάσια συναντιούνται για πρώτη φορά στο 12."},
{t:"1.5 ΕΚΠ",l:"medium",q:"ΕΚΠ(6, 8) = ?",a:["12","18","24","48"],c:2,e:"Το 24 είναι το μικρότερο κοινό πολλαπλάσιο."},
{t:"1.5 Πρώτοι αριθμοί",l:"easy",q:"Ποιος είναι πρώτος αριθμός;",a:["9","12","13","15"],c:2,e:"Το 13 έχει μόνο δύο διαιρέτες: 1 και 13."},
{t:"1.5 Πρώτοι παράγοντες",l:"easy",q:"12 = ?",a:["2×6","3×4","2×2×3","1×12"],c:2,e:"12 = 2×2×3 και όλοι οι παράγοντες είναι πρώτοι."},
{t:"1.5 Πρώτοι παράγοντες",l:"medium",q:"18 = ?",a:["2×9","3×6","2×3×3","1×18"],c:2,e:"18 = 2×3×3."},
{t:"1.5 Πρώτοι παράγοντες",l:"medium",q:"20 = ?",a:["2×10","4×5","2×2×5","1×20"],c:2,e:"20 = 2×2×5."},
{t:"1.5 ΜΚΔ",l:"hard",q:"Με ανάλυση σε πρώτους παράγοντες, ποιος είναι ο ΜΚΔ(24,36);",a:["6","8","12","18"],c:2,e:"24=2³×3 και 36=2²×3². Κρατάμε τους κοινούς παράγοντες με τους μικρότερους εκθέτες: 2²×3=12."},
{t:"1.5 ΕΚΠ",l:"hard",q:"Ποιο είναι το ΕΚΠ(12,18);",a:["24","30","36","54"],c:2,e:"12=2²×3 και 18=2×3². Παίρνουμε 2²×3²=36."}
];

let questions=[],idx=0,score=0,answered=false,wrong=[],timerId=null,timeLeft=0;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){
 const lev=$("level").value;
 questions=shuffle(BANK.filter(x=>lev==="all"||x.l===lev));
 idx=0;score=0;wrong=[];$("start").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render();
}
function render(){
 clearInterval(timerId);answered=false;
 const x=questions[idx];
 $("topic").textContent=x.t;$("counter").textContent=`Ερώτηση ${idx+1} από ${questions.length}`;$("score").textContent=`⭐ ${score}`;
 $("bar").style.width=`${idx/questions.length*100}%`;$("question").textContent=x.q;
 $("feedback").className="feedback hidden";$("next").classList.add("hidden");$("skip").classList.remove("hidden");
 const box=$("answers");box.innerHTML="";
 shuffle(x.a.map((text,k)=>({text,k}))).forEach(o=>{const b=document.createElement("button");b.className="answer";b.textContent=o.text;b.type="button";b.dataset.k=o.k;b.onclick=()=>choose(o.k,b);box.appendChild(b)});
 if($("timer").checked){timeLeft=20;updateTime();timerId=setInterval(()=>{timeLeft--;updateTime();if(timeLeft<=0){clearInterval(timerId);timeout()}},1000)}else $("time").textContent="";
}
function updateTime(){$("time").textContent=`⏱️ ${timeLeft}″`;}
function timeout(){if(answered)return;answered=true;wrong.push({x:questions[idx],picked:null});finishQuestion(false,"⏰ Ο χρόνος τελείωσε. Πάμε παρακάτω χωρίς άγχος!");}
function choose(k,btn){if(answered)return;answered=true;clearInterval(timerId);const x=questions[idx],buttons=[...$("answers").children];buttons.forEach(b=>b.disabled=true);
 const ok=k===x.c;if(ok){score+=10;btn.classList.add("correct");finishQuestion(true,`🎉 Μπράβο! ${x.e} +10 πόντοι!`)}else{btn.classList.add("wrong");buttons.find(b=>Number(b.dataset.k)===x.c)?.classList.add("correct");wrong.push({x,picked:x.a[k]});finishQuestion(false,`🙂 Δεν πειράζει. Η σωστή απάντηση είναι «${x.a[x.c]}». ${x.e}`)}}
function finishQuestion(ok,msg){$("score").textContent=`⭐ ${score}`;$("bar").style.width=`${(idx+1)/questions.length*100}%`;$("feedback").textContent=msg;$("feedback").className=`feedback ${ok?"good":"bad"}`;$("next").classList.remove("hidden");$("skip").classList.add("hidden");$("next").focus();}
$("next").onclick=()=>{idx++;if(idx<questions.length)render();else finish()};
$("skip").onclick=()=>{if(answered)return;clearInterval(timerId);answered=true;wrong.push({x:questions[idx],picked:"Παράλειψη"});finishQuestion(false,"➡️ Το προσπεράσαμε. Θα το ξαναδούμε στο τέλος.");};
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");const total=questions.length*10,p=score/total;
 $("stars").textContent=p>=.9?"⭐⭐⭐":p>=.7?"⭐⭐":"⭐";$("resultTitle").textContent=p>=.9?"Φοβερή αποστολή!":p>=.7?"Πολύ καλή δουλειά!":"Μπράβο που προσπάθησες!";
 $("resultText").textContent=`Σκορ: ${score} / ${total}. ${wrong.length?`Έχεις ${wrong.length} ερωτήσεις για επανάληψη.`:"Τα κατάφερες χωρίς λάθη! 🎉"}`;
}
$("reviewBtn").onclick=()=>{const r=$("review");r.classList.toggle("hidden");r.innerHTML=wrong.length?`<h3>📋 Μικρή επανάληψη</h3>`+wrong.map((w,n)=>`<div class="review-item"><b>${n+1}. ${w.x.q}</b><br><small>Η σωστή απάντηση: ${w.x.a[w.x.c]}</small></div>`).join(""):"<p>🎉 Δεν υπάρχουν λάθη για επανάληψη.</p>"};
$("startBtn").onclick=start;$("again").onclick=()=>{$("result").classList.add("hidden");$("start").classList.remove("hidden")};
</script>
</body>
</html>
